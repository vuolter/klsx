<svg xmlns="http://www.w3.org/2000/svg" width="760" height="756" viewBox="0 0 760 756" role="img" aria-label="Throughput benchmark: KLSX vs clsx, classnames and classix">
<style>
text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; }
.title { font-size: 15px; font-weight: 600; fill: #1f2937; }
.label { fill: #4b5563; }
.bold { font-weight: 700; fill: #111827; }
.ver { font-weight: 400; fill: #9ca3af; font-size: 11px; }
.value { fill: #4b5563; font-variant-numeric: tabular-nums; }
.klsx-hl { fill: #2563eb; }
.klsx-other { fill: #cbd5e1; }
